# Push an annotated version tag to build Halo for Windows, Linux and macOS and publish them as one GitHub release.
# The release notes are the tag's message, exactly as written:
#   git tag -a v0.3.0 -F notes.md      (or lazygit: Commits panel, T, then a tag description)
#   git push origin v0.3.0
# Git deletes lines starting with "#" from tag messages, which kills Markdown headings. This repo sets
# `git config core.commentChar ";"` so headings survive; on a fresh clone run that once (or tag with --cleanup=verbatim).
# In-app updates: the builds are signed with the TAURI_SIGNING_PRIVATE_KEY repository secret (the private half of
# the pubkey in tauri.conf.json), and the release carries latest.json, which installed copies of Halo check on start.
# macOS builds are signed ad hoc unless the APPLE_* secrets for a Developer ID are set, in which case they're signed
# and notarized with it (see https://v2.tauri.app/distribute/sign/macos/).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release and upload the builds

# Hosted runners sometimes drop crate downloads ("[55] Failed sending data to the peer ... Connection was reset").
# Retry harder and use plain HTTP/1.1 connections, which reset far less often than multiplexed HTTP/2 ones.
env:
  CARGO_NET_RETRY: 10
  CARGO_HTTP_MULTIPLEXING: false
  # The ffmpeg Halo ships on Windows: gyan.dev's full build (it has whisper for captions), pinned and checked.
  FFMPEG_VERSION: 9.0.1
  FFMPEG_SHA256: 2e8e28af97c2ae338ccef92e36da9b2a4cd21d0cad9dde093545606cb07f5b00

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          # Built on the oldest supported Ubuntu, so the binaries need no newer system libraries than it has
          # and run on current Debian, Fedora, Arch, openSUSE and the rest.
          - { name: Linux, os: ubuntu-22.04 }
          # Apple Silicon. ONNX Runtime has no prebuilt Intel Mac build with CoreML.
          - { name: macOS, os: macos-14 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # v1.2.3 -> 1.2.3, so the packages and the app carry the tag's version.
      - name: Read version from tag
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # --- Windows ---------------------------------------------------------------------------------------------

      # ffmpeg.exe and ffprobe.exe are too big for git (see .gitignore), so fetch the same build into ffmpeg/.
      - name: Fetch ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          name="ffmpeg-${FFMPEG_VERSION}-full_build"
          curl -fsSL --retry 5 -o ffmpeg.zip "https://github.com/GyanD/codexffmpeg/releases/download/${FFMPEG_VERSION}/${name}.zip"
          echo "${FFMPEG_SHA256}  ffmpeg.zip" | sha256sum -c -
          unzip -q ffmpeg.zip "${name}/bin/ffmpeg.exe" "${name}/bin/ffprobe.exe"
          mkdir -p ffmpeg
          mv "${name}/bin/ffmpeg.exe" "${name}/bin/ffprobe.exe" ffmpeg/
          rm -rf ffmpeg.zip "${name}"
          packaging/check-ffmpeg.sh ffmpeg/ffmpeg.exe whisper

      # The bundle takes DirectML.dll from target/release, where ort places it. On runners (unlike a dev machine
      # without Developer Mode) ort makes it a symlink into its cache, and Tauri's resource copy then copies the
      # file onto itself and fails with "being used by another process". Place it first and make it a real file.
      - name: Place DirectML.dll
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p ort-sys
          $dll = Get-Item target/release/DirectML.dll
          if ($dll.LinkType) {
            $source = $dll.ResolveLinkTarget($true).FullName
            Remove-Item $dll.FullName
            Copy-Item $source $dll.FullName
          }

      # --- Linux -----------------------------------------------------------------------------------------------

      # WebKitGTK to build against; GStreamer and its codecs so the AppImage can carry them (video playback in the
      # preview needs them); cmake and clang for whisper.cpp; libfuse2 to run the AppImage tooling.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev patchelf \
            cmake clang libfuse2 rpm \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      # A static ffmpeg (no system libraries), so every distro gets the same encoders and filters. BtbN's builds
      # follow ffmpeg's release branches; the newest branch there is used, and checked before it's packed.
      - name: Fetch ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          for v in 9.0 8.0 7.1; do
            name="ffmpeg-n${v}-latest-linux64-gpl-${v}"
            curl -fsSL --retry 3 -o ffmpeg.tar.xz "$base/$name.tar.xz" && break
            name=""
          done
          [ -n "$name" ] || { echo "::error::no ffmpeg build found"; exit 1; }
          sha256sum ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz "$name/bin/ffmpeg" "$name/bin/ffprobe"
          mkdir -p ffmpeg
          mv "$name/bin/ffmpeg" "$name/bin/ffprobe" ffmpeg/
          rm -rf ffmpeg.tar.xz "$name"
          packaging/check-ffmpeg.sh ffmpeg/ffmpeg

      # --- macOS -----------------------------------------------------------------------------------------------

      # Martin Riedl's static Apple Silicon builds. Apple Silicon only runs signed code, so they're signed ad hoc
      # before going into the app.
      - name: Fetch ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ffmpeg
          for tool in ffmpeg ffprobe; do
            curl -fsSL --retry 5 -o "$tool.zip" "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/$tool.zip"
            sha256sum "$tool.zip" 2>/dev/null || shasum -a 256 "$tool.zip"
            unzip -qo "$tool.zip" -d ffmpeg
            rm "$tool.zip"
          done
          chmod +x ffmpeg/ffmpeg ffmpeg/ffprobe
          xattr -c ffmpeg/ffmpeg ffmpeg/ffprobe || true
          codesign --force -s - ffmpeg/ffmpeg ffmpeg/ffprobe
          packaging/check-ffmpeg.sh ffmpeg/ffmpeg

      # Tauri signs (and notarizes) with these when they're set; left unset, the app is signed ad hoc.
      - name: Apple signing secrets
        if: runner.os == 'macOS'
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            [ -n "$value" ] && { echo "$name<<EOF"; echo "$value"; echo "EOF"; } >> "$GITHUB_ENV"
          done
          true
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # --- Build -----------------------------------------------------------------------------------------------

      # Linux and macOS add the fetched ffmpeg as resources here; Windows lists its own in tauri.windows.conf.json.
      - name: Build packages
        run: |
          config=$(python3 - <<'PY'
          import json, os, platform
          config = {"version": os.environ["VERSION"], "bundle": {"createUpdaterArtifacts": True}}
          if os.environ["RUNNER_OS"] != "Windows":
              config["bundle"]["resources"] = {"ffmpeg/ffmpeg": "ffmpeg", "ffmpeg/ffprobe": "ffprobe"}
          print(json.dumps(config))
          PY
          )
          echo "$config"
          npx --yes @tauri-apps/cli@2 build --config "$config"
        env:
          VERSION: ${{ steps.version.outputs.number }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Everything to publish, in one flat folder. The macOS update archive gets the version and architecture in
      # its name, like the other files.
      - name: Collect packages
        run: |
          mkdir -p dist
          b=target/release/bundle
          v=${{ steps.version.outputs.number }}
          case "$RUNNER_OS" in
            Windows) cp $b/nsis/*.exe $b/nsis/*.exe.sig dist/ ;;
            Linux)   cp $b/deb/*.deb $b/rpm/*.rpm $b/appimage/*.AppImage $b/appimage/*.AppImage.sig dist/ ;;
            macOS)   cp $b/dmg/*.dmg dist/
                     cp $b/macos/Halo.app.tar.gz "dist/Halo_${v}_aarch64.app.tar.gz"
                     cp $b/macos/Halo.app.tar.gz.sig "dist/Halo_${v}_aarch64.app.tar.gz.sig" ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: halo-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # actions/checkout turns annotated tags into lightweight ones, so fetch the real tag object first.
      - name: Read release notes from the tag message
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag" ]; then
            git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}" > notes.md
          else
            echo "::warning::${GITHUB_REF_NAME} is not an annotated tag, so the release has no notes. Use: git tag -a ${GITHUB_REF_NAME} --cleanup=verbatim -F notes.md"
            : > notes.md
          fi
          cat notes.md

      # latest.json tells installed copies of Halo where each platform's update is and its signature: the NSIS
      # installer on Windows, the AppImage on Linux (packages update through the system), the app archive on macOS.
      - name: Write the updater manifest and the Arch package recipe
        run: |
          python - <<'PY'
          import datetime, glob, hashlib, json, os
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.lstrip("v")
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/"
          platforms = {}
          for key, pattern in [("windows-x86_64", "dist/*.exe"), ("linux-x86_64", "dist/*.AppImage"),
                               ("darwin-aarch64", "dist/*.app.tar.gz")]:
              found = [p for p in glob.glob(pattern) if os.path.isfile(p + ".sig")]
              assert found, f"no signed {pattern}: is the TAURI_SIGNING_PRIVATE_KEY secret set?"
              platforms[key] = {"url": base + os.path.basename(found[0]), "signature": open(found[0] + ".sig").read().strip()}
          manifest = {"version": version, "notes": open("notes.md").read().strip(),
                      "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "platforms": platforms}
          json.dump(manifest, open("dist/latest.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          # The Arch recipe, pointing at this release's .deb and the LICENSE at this tag, with their checksums.
          deb = glob.glob("dist/*.deb")[0]
          sha = hashlib.sha256(open(deb, "rb").read()).hexdigest()
          recipe = open("packaging/arch/PKGBUILD").read()
          recipe = recipe.replace("pkgver=0.0.0", f"pkgver={version.replace('-', '_')}")
          recipe = recipe.replace("_tag=v0.0.0", f"_tag={tag}").replace("_deb=Halo_0.0.0_amd64.deb", f"_deb={os.path.basename(deb)}")
          license_sha = hashlib.sha256(open("LICENSE", "rb").read()).hexdigest()
          recipe = recipe.replace("sha256sums=('SKIP' 'SKIP')", f"sha256sums=('{sha}' '{license_sha}')")
          open("dist/PKGBUILD", "w").write(recipe)
          PY

      - uses: softprops/action-gh-release@v2
        with:
          name: Halo ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }} # v1.0.0-beta.1 is marked as a pre-release
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.exe.sig
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.AppImage.sig
            dist/*.dmg
            dist/*.app.tar.gz
            dist/*.app.tar.gz.sig
            dist/latest.json
            dist/PKGBUILD
