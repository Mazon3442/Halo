# Push an annotated version tag to build the Windows installer and publish it as a GitHub release.
# The release notes are the tag's message, exactly as written:
#   git tag -a v0.3.0 -F notes.md      (or lazygit: Commits panel, T, then a tag description)
#   git push origin v0.3.0
# Git deletes lines starting with "#" from tag messages, which kills Markdown headings. This repo sets
# `git config core.commentChar ";"` so headings survive; on a fresh clone run that once (or tag with --cleanup=verbatim).
# In-app updates: the installer is signed with the TAURI_SIGNING_PRIVATE_KEY repository secret (the private half of
# the pubkey in tauri.conf.json), and the release carries latest.json, which installed copies of Halo check on start.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release and upload the installer

# Hosted runners sometimes drop crate downloads ("[55] Failed sending data to the peer ... Connection was reset").
# Retry harder and use plain HTTP/1.1 connections, which reset far less often than multiplexed HTTP/2 ones.
env:
  CARGO_NET_RETRY: 10
  CARGO_HTTP_MULTIPLEXING: false
  # The ffmpeg Halo ships: gyan.dev's full build (it has whisper for captions), pinned and checked.
  FFMPEG_VERSION: 9.0.1
  FFMPEG_SHA256: 2e8e28af97c2ae338ccef92e36da9b2a4cd21d0cad9dde093545606cb07f5b00

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ffmpeg.exe and ffprobe.exe are too big for git (see .gitignore), so fetch the same build into ffmpeg/.
      - name: Fetch ffmpeg
        run: |
          name="ffmpeg-${FFMPEG_VERSION}-full_build"
          curl -fsSL --retry 5 -o ffmpeg.zip "https://github.com/GyanD/codexffmpeg/releases/download/${FFMPEG_VERSION}/${name}.zip"
          echo "${FFMPEG_SHA256}  ffmpeg.zip" | sha256sum -c -
          unzip -q ffmpeg.zip "${name}/bin/ffmpeg.exe" "${name}/bin/ffprobe.exe"
          mkdir -p ffmpeg
          mv "${name}/bin/ffmpeg.exe" "${name}/bin/ffprobe.exe" ffmpeg/
          rm -rf ffmpeg.zip "${name}"

      # v1.2.3 -> 1.2.3, so the installer and the app carry the tag's version.
      - name: Read version from tag
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The bundle takes DirectML.dll from target/release, which the plain cargo build puts there.
      - name: Build installer
        run: |
          cargo build --release
          npx --yes @tauri-apps/cli@2 build --config "{\"version\":\"${{ steps.version.outputs.number }}\",\"bundle\":{\"createUpdaterArtifacts\":true}}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # actions/checkout turns annotated tags into lightweight ones, so fetch the real tag object first.
      - name: Read release notes from the tag message
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag" ]; then
            git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}" > notes.md
          else
            echo "::warning::${GITHUB_REF_NAME} is not an annotated tag, so the release has no notes. Use: git tag -a ${GITHUB_REF_NAME} --cleanup=verbatim -F notes.md"
            : > notes.md
          fi
          cat notes.md

      # latest.json tells installed copies of Halo where the new installer is and its signature.
      - name: Write the updater manifest
        run: |
          mkdir -p dist
          cp target/release/bundle/nsis/*.exe target/release/bundle/nsis/*.exe.sig dist/
          python - <<'PY'
          import datetime, glob, json, os
          tag = os.environ["GITHUB_REF_NAME"]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/"
          found = [p for p in glob.glob("dist/*.exe") if os.path.isfile(p + ".sig")]
          assert found, "the installer is unsigned: is the TAURI_SIGNING_PRIVATE_KEY secret set?"
          manifest = {"version": tag.lstrip("v"), "notes": open("notes.md").read().strip(),
                      "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "platforms": {"windows-x86_64": {"url": base + os.path.basename(found[0]),
                                                       "signature": open(found[0] + ".sig").read().strip()}}}
          json.dump(manifest, open("dist/latest.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - uses: softprops/action-gh-release@v2
        with:
          name: Halo ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }} # v1.0.0-beta.1 is marked as a pre-release
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.exe.sig
            dist/latest.json
