[package]
name = "halo"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["multipart"] }
ort = "=2.0.0-rc.15"
rayon = "1.12.0"
rfd = "0.16"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
ttf-parser = "0.25"
uuid = { version = "1", features = ["v4"] }

# The matting and alignment models run on the GPU where ONNX Runtime has a backend for it:
# DirectML on Windows, Core ML on Apple Silicon Macs. Linux runs them on the CPU.
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["coreml"] }
# Speech recognition. Windows uses the whisper.cpp built into the ffmpeg Halo ships; Linux and
# macOS builds of ffmpeg rarely have it, so Halo carries its own (on the GPU through Metal).
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Loaded at runtime from the library packages carry (packaging/fetch-onnxruntime.sh), which runs on
# older distros than ort's linked-in builds do.
ort = { version = "=2.0.0-rc.15", features = ["load-dynamic"] }
whisper-rs = "0.16"

[features]
# Runs whisper.cpp on the GPU through Vulkan on Linux. Needs the Vulkan headers and glslc to build.
vulkan = ["whisper-rs/vulkan"]

[profile.release]
debug = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
