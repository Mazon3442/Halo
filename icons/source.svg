<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Halo: a bright subject inside a ring of colour, with the soft glow of a blurred background. -->
  <defs>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="216"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16181d"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#7cc4ff"/>
      <stop offset="0.45" stop-color="#a98bff"/>
      <stop offset="0.8" stop-color="#ff8a6b"/>
      <stop offset="1" stop-color="#ffc56b"/>
    </linearGradient>
    <radialGradient id="core" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe7f2"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="64" y="64" width="896" height="896" fill="url(#bg)"/>
    <circle cx="512" cy="512" r="262" fill="none" stroke="url(#ring)" stroke-width="120" opacity="0.75" filter="url(#glow)"/>
    <circle cx="512" cy="512" r="262" fill="none" stroke="url(#ring)" stroke-width="84"/>
    <circle cx="512" cy="512" r="118" fill="url(#core)"/>
  </g>
</svg>
